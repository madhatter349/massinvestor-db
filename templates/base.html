<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Investment Firm Database{% endblock %}</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--accent:#38bdf8;--text:#e2e8f0;--muted:#94a3b8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5;}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
.container{max-width:1100px;margin:0 auto;padding:0 1rem;}
header{background:var(--card);border-bottom:1px solid var(--border);padding:1rem 0;margin-bottom:2rem;}
header .container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;}
header h1{font-size:1.25rem;}
nav a{margin-left:1rem;color:var(--muted);}
nav a:hover{color:var(--text);}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;}
.grid{display:grid;gap:1rem;}
.stat{text-align:center;}
.stat .num{font-size:2rem;font-weight:700;color:var(--accent);}
.stat .lbl{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;}
.chip{background:#0b1220;border:1px solid var(--border);padding:.2rem .6rem;border-radius:999px;font-size:.8rem;}
.muted{color:var(--muted);font-size:.85rem;}
table{width:100%;border-collapse:collapse;}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;}
.bar{height:8px;background:var(--accent);border-radius:4px;}
footer{margin:3rem 0 1.5rem;color:var(--muted);font-size:.8rem;text-align:center;}
.pill{display:inline-block;background:#0b1220;border:1px solid var(--border);padding:.15rem .5rem;border-radius:6px;font-size:.8rem;}
</style>
</head>
<body>
<header>
  <div class="container">
    <h1>💼 Investment Firm Database</h1>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/browse">Browse</a>
    </nav>
  </div>
</header>
<div class="container">
{% block content %}{% endblock %}
</div>
<footer>Data crawled from the public Massinvestor directory (personal/private research only — see Terms of Use).</footer>
</body>
</html>
